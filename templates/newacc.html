{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Create Account</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{% static 'book_app/newacc.css' %}" /> <!-- Link to external CSS -->
</head>
<body>
  <div class="container">
    <div class="form-box">
      <h2>Create New Account</h2>
      <form action="{% url 'newacc' %}" method="POST">
        {% csrf_token %}
        <div class="input-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="username" placeholder="Your Name" required>
        </div>
        <div class="input-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="your@email.com" required>
        </div>
        <div class="input-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Password" required>
        </div>
        <div class="input-group">
          <label for="confirm">Confirm Password</label>
          <input type="password" id="confirm" name="confirm_password" placeholder="Confirm Password" required>
        </div>
        <button type="submit">Create Account</button>
        <p class="login-link">Already have an account? <a href="/">Login</a></p>
      </form>
      {% if messages %}
  <ul>
    {% for message in messages %}
      <li style="color: red;">{{ message }}</li>
    {% endfor %}
  </ul>
{% endif %}
    </div>
  </div>
</body>
</html>
