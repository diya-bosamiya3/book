{% extends 'base.html' %}
{% block body %}
<div class="container mt-4">
  <h3>Notifications</h3>
  {% for n in notifications %}
    <div class="alert alert-info">
      {{ n.message }} <br>
      <small class="text-muted">{{ n.created_at|date:"M d, Y H:i" }}</small>
    </div>
  {% empty %}
    <p>No notifications yet.</p>
  {% endfor %}
</div>
{% endblock %}
