<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Bazaar - Payment</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body {
    background: linear-gradient(135deg, #f8f9fa, #e3e7ee);
    font-family: Arial, sans-serif;
    padding: 2rem;
  }
  .payment-container {
    max-width: 900px;
    background: white;
    padding: 2rem;
    border-radius: 1rem;
    box-shadow: 0 8px 24px rgba(0,0,0,0.1);
    margin: auto;
  }
  h1 {
    font-size: 2rem;
    font-weight: bold;
    margin-bottom: 1rem;
    color: #333;
  }
  .summary {
    background: #f7f7f7;
    padding: 1.5rem;
    border-radius: 0.5rem;
    margin-bottom: 2rem;
  }
  .summary img {
    max-width: 120px;
    border-radius: 0.3rem;
    margin-right: 1rem;
  }
  .summary h2 {
    font-size: 1.2rem;
    color: #444;
  }
  label {
    font-weight: 500;
    color: #555;
  }
  .form-control {
    border-radius: 0.3rem;
  }
  .pay-btn {
    background-color: #28a745;
    border: none;
    padding: 0.75rem 1.5rem;
    border-radius: 0.3rem;
    color: white;
    font-size: 1.1rem;
    width: 100%;
    transition: background 0.3s;
  }
  .pay-btn:hover {
    background-color: #218838;
  }
  .footer {
    margin-top: 2rem;
    text-align: center;
    color: #999;
    font-size: 0.9rem;
  }
</style>
</head>
<body>

<div class="payment-container">
  <h1>Complete Payment</h1>
  
  <!-- Book Summary -->
  <div class="summary d-flex align-items-center">
    <img src="https://via.placeholder.com/120" alt="Book Image">
    <div>
      <h2>The Great Gatsby by F. Scott Fitzgerald</h2>
      <p>Price: ₹499</p>
    </div>
  </div>

  <!-- Payment Form -->
  <form>
    <div class="row g-3 mb-3">
      <div class="col-md-6">
        <label for="cardName">Cardholder's Name</label>
        <input type="text" id="cardName" class="form-control" placeholder="Full name as on card" required>
      </div>
      <div class="col-md-6">
        <label for="cardNumber">Card Number</label>
        <input type="text" id="cardNumber" class="form-control" placeholder="1234 5678 9012 3456" required maxlength="19">
      </div>
    </div>

    <div class="row g-3 mb-3">
      <div class="col-md-4">
        <label for="expiry">Expiry Date</label>
        <input type="text" id="expiry" class="form-control" placeholder="MM/YY" required>
      </div>
      <div class="col-md-4">
        <label for="cvc">CVC</label>
        <input type="text" id="cvc" class="form-control" placeholder="123" required maxlength="3">
      </div>
      <div class="col-md-4">
        <label for="zip">Zip/Postal Code</label>
        <input type="text" id="zip" class="form-control" placeholder="e.g. 110001" required>
      </div>
    </div>

    <button type="submit" class="pay-btn">Pay ₹499 Now</button>
  </form>

  <div class="footer mt-4">
    &copy; 2025 Book Bazaar. Secure Payment Gateway.
  </div>
</div>
<h2>Printing</h2>

</body>
</html>
