<!-- payment.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book Payment</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%);
      font-family: 'Segoe UI', sans-serif;
    }

    .payment-container {
      max-width: 750px;
      margin: 3rem auto;
      background: #ffffff;
      padding: 2.5rem;
      border-radius: 20px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.1);
    }

    .payment-methods {
      display: flex;
      gap: 10px;
      margin: 2rem 0 1rem;
    }

    .payment-methods input[type="radio"] {
      display: none;
    }

    .payment-methods label {
      flex: 1;
      padding: 0.8rem;
      text-align: center;
      background-color: #f1f1f1;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: 500;
      border: 2px solid transparent;
    }

    .payment-methods input[type="radio"]:checked + label {
      background: linear-gradient(to right, #667eea, #764ba2);
      color: white;
      border-color: #5a67d8;
      font-weight: bold;
    }

    .form-section {
      display: none;
    }

    .form-section.active {
      display: block;
    }

    .form-label {
      font-weight: 600;
      margin-top: 0.8rem;
    }

    input, textarea {
      border-radius: 10px !important;
      border: 1px solid #ccc;
      padding: 0.6rem;
      width: 100%;
      transition: 0.3s;
    }

    input:focus, textarea:focus {
      border-color: #764ba2;
      box-shadow: 0 0 0 0.15rem rgba(118, 75, 162, 0.25);
      outline: none;
    }

    button[type="submit"] {
      background: linear-gradient(to right, #667eea, #764ba2);
      border: none;
      padding: 0.75rem;
      color: white;
      border-radius: 12px;
      width: 100%;
      font-size: 1.1rem;
      margin-top: 1rem;
      font-weight: 600;
      transition: 0.3s;
    }

    button[type="submit"]:hover {
      background: linear-gradient(to right, #5a67d8, #6b46c1);
    }
  </style>
</head>
<body>

<div class="payment-container">
  <h2 class="text-center mb-3">📘 Checkout</h2>
  <p class="text-center text-muted mb-4">Secure payment for your book purchase</p>

  <form method="POST">
    {% csrf_token %}

    <!-- Book Details -->
    <div class="book-details mb-4 d-flex gap-3 align-items-start">
      <img src="{{ book.book_photo.url }}" class="rounded shadow" alt="{{ book.book_title }}" style="width: 150px; height: 210px; object-fit: cover;">
      <div>
        <h5 class="text-primary fw-bold">{{ book.book_title }}</h5>
        <p><strong>Author:</strong> {{ book.author }}</p>
        <p><strong>Price:</strong> ₹{{ book.price }}</p>
        <p class="text-muted small">Thank you for choosing second-hand books 🌱</p>
      </div>
    </div>

    <!-- Payment Method Options -->
    <div class="payment-methods">
      <input type="radio" id="method-credit" name="payment_method" value="credit" checked>
      <label for="method-credit" onclick="showSection('credit')">Credit Card</label>

      <input type="radio" id="method-upi" name="payment_method" value="upi">
      <label for="method-upi" onclick="showSection('upi')">UPI</label>

      <input type="radio" id="method-cash" name="payment_method" value="cash">
      <label for="method-cash" onclick="showSection('cash')">Cash</label>
    </div>

    <!-- Credit Card Section -->
    <div id="credit" class="form-section active">
      <label class="form-label">Cardholder Name</label>
      <input type="text" name="name" value="{{ request.user.username }}">

      <label class="form-label">Card Number</label>
      <input type="text" name="card_num" maxlength="16">

      <label class="form-label">Expiry Date</label>
      <input type="text" name="expiry">

      <label class="form-label">CVV</label>
      <input type="text" name="cvv" maxlength="3">
    </div>

    <!-- UPI Section -->
    <div id="upi" class="form-section">
      <label class="form-label">Your Name</label>
      <input type="text" name="name" value="{{ request.user.username }}">

      <label class="form-label">UPI ID</label>
      <input type="text" name="upi_id" placeholder="example@upi">
    </div>

    <!-- Cash Section -->
    <div id="cash" class="form-section">
      <label class="form-label">Your Name</label>
      <input type="text" name="name" value="{{ request.user.username }}">

      <label class="form-label">Delivery Address</label>
      <textarea name="address" rows="3" placeholder="Street, City, ZIP"></textarea>

      <label class="form-label">Contact Number</label>
      <input type="text" name="contact" placeholder="10-digit number">
    </div>

    <button type="submit">Pay Now</button>
  </form>
</div>

<script>
  function showSection(method) {
    document.querySelectorAll('.form-section').forEach(section => {
      section.classList.remove('active');
    });
    document.getElementById(method).classList.add('active');
  }

  window.onload = () => {
    const selected = document.querySelector('input[name="payment_method"]:checked').value;
    showSection(selected);
  };
</script>

</body>
</html>
